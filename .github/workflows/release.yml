name: Package and release

# Fires on any pushed tag (e.g. "v0.0.12", matching EverGear.VERSION with a
# "v" prefix). BigWigsMods/packager reads the .toc + .pkgmeta, substitutes
# @project-version@ (and any other @...@ keywords) with the tag name, builds
# a release zip, and uploads it to CurseForge/WoWInterface/Wago for any of
# the CF_API_KEY / WOWI_API_TOKEN / WAGO_API_TOKEN secrets that are actually
# set on this repo -- it silently skips any target whose secret is missing,
# so this workflow is safe to run before those are set up. See README.md's
# "Releasing" section.
on:
  push:
    tags:
      - '*'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
