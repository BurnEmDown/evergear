name: CI

# Pull requests: build the addon zip and attach it to the run as a downloadable
# artifact (nothing is published).
# Push to master (i.e. a merged PR): build the same zip, upload it to CurseForge
# as a new release, then tag that commit with the current EverGear.VERSION.
#
# The version comes from Core/Constants.lua, so bump it (and CHANGELOG.md) in the
# PR as usual. If a v<version> tag already exists, the master run builds the zip
# but skips the upload and tagging, so merging a change without bumping the
# version can't publish a duplicate release.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write   # needed to push the version tag on master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the packager derives the version and changelog from git history/tags

      - name: Read addon version
        id: version
        run: |
          VERSION=$(grep -oP 'EverGear\.VERSION = "\K[^"]+' Core/Constants.lua)
          if [ -z "$VERSION" ]; then
            echo "Could not read EverGear.VERSION from Core/Constants.lua" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # The packager substitutes @project-version@ from the nearest git tag, so
      # tag the checked-out commit locally (not pushed yet) to give the zip the
      # right version.
      - name: Tag commit locally for the packager
        run: git tag -f "${{ steps.version.outputs.tag }}"

      # ----- Pull requests: build only -----
      - name: Build zip (no upload)
        if: github.event_name == 'pull_request'
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Upload zip as workflow artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EverGear-${{ steps.version.outputs.tag }}
          path: .release/*.zip
          include-hidden-files: true   # .release is a dot-directory, skipped by default
          if-no-files-found: error

      # ----- Merge to master: release -----
      - name: Build zip and upload to CurseForge
        if: github.event_name == 'push' && steps.exists.outputs.released == 'false'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}   # older name, in case the packager version still reads it

      - name: Build zip (version already released, no upload)
        if: github.event_name == 'push' && steps.exists.outputs.released == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Push version tag
        if: github.event_name == 'push' && steps.exists.outputs.released == 'false'
        run: git push origin "${{ steps.version.outputs.tag }}"

      - name: Keep the zip as a workflow artifact too
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: EverGear-${{ steps.version.outputs.tag }}
          path: .release/*.zip
          include-hidden-files: true   # .release is a dot-directory, skipped by default
          if-no-files-found: error

      - name: Note skipped release
        if: github.event_name == 'push' && steps.exists.outputs.released == 'true'
        run: echo "::notice::Tag ${{ steps.version.outputs.tag }} already exists, so nothing was uploaded to CurseForge. Bump EverGear.VERSION to release."
