name: CI

# Two jobs:
#
#   build    Runs on every pull request update. Builds the addon zip (no upload) and
#            attaches it to the run as a downloadable artifact.
#
#   release  Runs when a pull request into master is merged. Tags the merge commit
#            v<EverGear.VERSION> locally, uploads a new release to CurseForge, and only
#            then pushes the tag.
#
# Why release triggers on the PR "closed" event instead of a push to master: on a push
# to a branch, BigWigsMods/packager refuses to build when a tag points at HEAD ("Found
# future tag ... not packaging"), assuming the tag push will trigger its own build.
# We need the tag on HEAD so the zip gets the right version, so the packager must not
# see a branch push. A pull_request event doesn't hit that check.
#
# The version comes from Core/Constants.lua, so bump it (and CHANGELOG.md) in the PR as
# usual. If a v<version> tag already exists, release does nothing, so merging a change
# without bumping the version can't publish a duplicate.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
#
#   build    Runs on every pull request and every push to master. Builds the addon
#            zip (no upload) and attaches it to the run as a downloadable artifact.
#
#   release  Runs only on a push to master (i.e. a merged PR), and only after
#            build succeeded. Uploads a new release to CurseForge, then tags the
#            commit v<EverGear.VERSION>.
#
# The version comes from Core/Constants.lua, so bump it (and CHANGELOG.md) in the
# PR as usual. If a v<version> tag already exists, release does nothing, so
# merging a change without bumping the version can't publish a duplicate.
#
# Note: BigWigsMods/packager builds and uploads in one go and has no "upload this
# existing zip" mode, so the release job runs the packager again (a fresh build
# from the same commit) rather than reusing build's zip.
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the packager derives the version and changelog from git history/tags

      - name: Read addon version
        id: version
        run: |
          VERSION=$(grep -oP 'EverGear\.VERSION = "\K[^"]+' Core/Constants.lua)
          if [ -z "$VERSION" ]; then
            echo "Could not read EverGear.VERSION from Core/Constants.lua" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # The packager substitutes @project-version@ from the nearest git tag, so
      # tag the checked-out commit locally (never pushed from this job) to give
      # the zip the right version.
      - name: Tag commit locally for the packager
        run: git tag -f "${{ steps.version.outputs.tag }}"

      - name: Build zip (no upload)
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverGear-${{ steps.version.outputs.tag }}
          path: .release/*.zip
          include-hidden-files: true   # .release is a dot-directory, skipped by default
          if-no-files-found: error

  release:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the version tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Read addon version
        id: version
        run: |
          VERSION=$(grep -oP 'EverGear\.VERSION = "\K[^"]+' Core/Constants.lua)
          if [ -z "$VERSION" ]; then
            echo "Could not read EverGear.VERSION from Core/Constants.lua" >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already released
        id: exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${{ steps.version.outputs.tag }} already exists, so nothing was uploaded to CurseForge. Bump EverGear.VERSION to release."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag commit locally for the packager
        if: steps.exists.outputs.released == 'false'
        run: git tag "${{ steps.version.outputs.tag }}"

      - name: Upload to CurseForge
        if: steps.exists.outputs.released == 'false'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Push version tag
        if: steps.exists.outputs.released == 'false'
        run: git push origin "${{ steps.version.outputs.tag }}"
